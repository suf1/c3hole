; C3Hole - DNS ad-blocking sinkhole for the ESP32-C3 (no PSRAM needed)
[platformio]
default_envs = c3

[env:c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
; CA bundle for HTTPS blocklist/firmware updates (created by tools/make_ca_bundle.py)
board_build.embed_files = data/cert/x509_crt_bundle.bin
monitor_speed = 115200
build_flags =
    -Os
    -DNDEBUG
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DC3HOLE_VERSION=\"1.0.0\"
